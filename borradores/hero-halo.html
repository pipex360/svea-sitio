<!--
  Propuesta «Halo» · copia del hero de hirael.com/embed/templates/usd-halo.
  Estructura idéntica: cabecera clara con botón negro, tarjeta con esquinas
  redondeadas separada del borde, veladuras blancas sobre la foto, titular
  negro, botón negro con flecha en círculo blanco, y abajo la cinta que se
  desplaza (el efecto del original), aquí con los logos reales de clientes.
  Fondo: las tres fotos del slideshow actual de la home, en fundido lento.
  Sin JavaScript. El H1 conserva «Consultoría Ambiental y Cumplimiento Normativo».
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&family=Inter:wght@400;500&display=swap">
<style>
  .halo{background:#f4f2ec;color:#161b22;font-family:Inter,ui-sans-serif,system-ui,sans-serif;
    display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

  /* cabecera clara, como en el original */
  .halo-cab{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px 6px}
  .halo-marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:#161b22;font-family:Manrope,Inter,sans-serif;font-weight:600;font-size:20px;letter-spacing:-.01em}
  .halo-marca img{height:40px;width:auto}
  .halo-nav{display:flex;gap:32px}
  .halo-nav a{color:#161b22;text-decoration:none;font-size:16px}
  .halo-nav a:hover{opacity:.7}
  .halo-cab .halo-btn{padding:0 28px;height:48px;white-space:nowrap}

  /* tarjeta del hero */
  .halo-seccion{flex:1;display:flex;align-items:flex-end;padding:0 24px 24px}
  .halo-tarjeta{position:relative;width:100%;max-width:88rem;margin:0 auto;overflow:hidden;border-radius:16px;
    height:calc(100dvh - 96px);min-height:560px;max-height:900px}
  .halo-fondo{position:absolute;inset:0}
  .halo-fondo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;
    transform-origin:center center;will-change:opacity,transform;
    animation:halo-fundido 18s linear infinite}
  .halo-fondo img:nth-child(1){animation-delay:0s;opacity:1}
  .halo-fondo img:nth-child(2){animation-delay:6s}
  .halo-fondo img:nth-child(3){animation-delay:12s}
  /* Ken Burns, como el slideshow original: la foto se acerca lentamente
     mientras está a la vista y recupera su tamaño mientras está invisible,
     así el ciclo no da un salto al volver a empezar. */
  @keyframes halo-fundido{
    0%{opacity:0;transform:scale(1)}
    5%{opacity:1;transform:scale(1.02)}
    33%{opacity:1;transform:scale(1.12)}
    38%{opacity:0;transform:scale(1.14)}
    39%{opacity:0;transform:scale(1)}
    100%{opacity:0;transform:scale(1)}
  }
  .halo-fondo img:nth-child(1){animation-name:halo-fundido-primera}
  @keyframes halo-fundido-primera{
    0%{opacity:1;transform:scale(1)}
    33%{opacity:1;transform:scale(1.12)}
    38%{opacity:0;transform:scale(1.14)}
    39%{opacity:0;transform:scale(1)}
    95%{opacity:0;transform:scale(1)}
    100%{opacity:1;transform:scale(1)}
  }
  /* veladuras blancas: de arriba (70 %) y de abajo (85 %), igual que el original */
  .halo-velo-arriba{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.7),rgba(255,255,255,.2) 50%,rgba(255,255,255,.1))}
  .halo-velo-abajo{position:absolute;left:0;right:0;bottom:0;height:50%;background:linear-gradient(to top,rgba(255,255,255,.85),rgba(255,255,255,.4) 50%,transparent)}

  .halo-contenido{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;height:100%;padding:144px 48px 48px}
  .halo h1{margin:0 0 16px;max-width:22ch;font-family:Manrope,Inter,sans-serif;font-weight:500;letter-spacing:-.04em;line-height:1.1;
    font-size:clamp(36px,4.2vw,56px);color:#000;text-transform:none;text-wrap:balance}
  .halo p{margin:0 0 32px;max-width:44ch;font-size:18px;line-height:1.6;color:rgba(0,0,0,.7)}
  .halo-btn{display:inline-flex;align-items:center;gap:12px;height:auto;padding:8px 8px 8px 32px;border-radius:999px;
    background:#000;color:#fff !important;font-size:18px;font-weight:500;text-decoration:none;transition:background .2s}
  .halo-btn span{color:#fff !important}
  .halo-btn .circulo,.halo-btn .circulo svg{color:#000 !important}
  .halo-btn:hover{background:#1f2937}
  .halo-btn .circulo{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#fff;color:#000}
  .halo-btn .circulo svg{width:20px;height:20px}

  /* la cinta que se desplaza, con fundido en los bordes */
  .halo-cinta{margin-top:auto;width:100%;max-width:28rem;overflow:hidden;padding-top:96px;
    -webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent)}
  .halo-cinta ul{display:flex;width:max-content;margin:0;padding:0;list-style:none;align-items:center;animation:halo-cinta 22s linear infinite}
  .halo-cinta li{margin:0 28px;flex-shrink:0}
  .halo-cinta img{height:26px;width:auto;filter:grayscale(1) contrast(1.1);opacity:.8}
  @keyframes halo-cinta{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  @media (max-width:820px){
    .halo-nav{display:none}
    .halo-cab{padding:16px 16px 4px}
    .halo-cab .halo-btn{padding:0 18px;height:42px;font-size:15px}
    .halo-seccion{padding:0 12px 12px}
    .halo-tarjeta{height:calc(100dvh - 80px);min-height:520px}
    .halo-contenido{padding:96px 24px 28px}
    .halo p{font-size:16px}
    .halo-cinta{padding-top:48px}
  }
  @media (prefers-reduced-motion:reduce){.halo-fondo img{animation:none}.halo-fondo img:nth-child(1){opacity:1}.halo-cinta ul{animation:none}}
</style>
